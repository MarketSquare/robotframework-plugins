name: Plugin feedback
description: Tell us whether a plugin helped, and with what.
title: "[feedback] "
labels: [feedback]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking a minute. Feedback is how we learn which plugins work; the
        installer and plugins send nothing on their own. A label for the plugin you
        pick is added automatically.
  - type: dropdown
    id: plugin
    attributes:
      label: Plugin
      description: Which plugin is this about?
      options:
        - rf-agentskills
        - rf-api
        - rf-core
        - rf-desktop
        - rf-mobile
        - rf-web
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent and model
      description: For example "Claude Code 2.1, Sonnet 5.5" or "Copilot CLI, GPT-6".
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Robot Framework and library versions
      description: For example "Robot Framework 7.4.2, Browser 20.1.0".
    validations:
      required: true
  - type: dropdown
    id: helped
    attributes:
      label: Did the plugin help?
      options:
        - "Yes"
        - Partly
        - "No"
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What happened
      description: What you asked the agent, and what was good or wrong about the result.
