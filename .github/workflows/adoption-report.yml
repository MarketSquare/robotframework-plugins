# Quarterly adoption report (spec adoption-reporting; design D11).
#
# On the first day of each quarter, builds docs/reports/adoption-<YYYY>-Q<n>.md
# for the quarter that just ended and opens a PR with it, so a person reads the
# report before it is published. Sources: the adoption-data branch (GitHub
# traffic), pypistats.org (PyPI downloads), this repository's issues, and the
# eval baselines at each <plugin>--v* tag.
name: Adoption report

on:
  schedule:
    - cron: "23 6 1 1,4,7,10 *"
  workflow_dispatch:
    inputs:
      quarter:
        description: "Quarter to report, e.g. 2026-Q4 (default: the one that just ended)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Choose the quarter
        id: q
        env:
          INPUT: ${{ inputs.quarter }}
        run: |
          if [ -n "$INPUT" ]; then
            echo "$INPUT" | grep -Eq '^[0-9]{4}-Q[1-4]$' || { echo "bad quarter: $INPUT"; exit 1; }
            q="$INPUT"
          else
            q=$(python3 -c 'import datetime as d; t=d.date.today()-d.timedelta(days=1); print(f"{t.year}-Q{(t.month-1)//3+1}")')
          fi
          echo "quarter=$q" >> "$GITHUB_OUTPUT"
      - name: Gather the data
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p "$RUNNER_TEMP/data"
          if git ls-remote --exit-code --heads origin adoption-data >/dev/null; then
            git fetch origin adoption-data
            git archive origin/adoption-data traffic | tar -x -C "$RUNNER_TEMP/data"
          fi
          curl -fsS --proto '=https' "https://pypistats.org/api/packages/robotframework-plugins/overall" \
            -o "$RUNNER_TEMP/data/pypi.json" || echo "pypistats unavailable; the report says so"
          gh api --paginate "repos/$REPO/issues?state=all&per_page=100" \
            | jq -s '[.[][] | select(.pull_request | not) | {number, state, labels: [.labels[].name], created_at, body}]' \
            > "$RUNNER_TEMP/data/issues.json"
      - name: Build the report
        env:
          QUARTER: ${{ steps.q.outputs.quarter }}
        run: |
          python3 scripts/adoption-report.py --data "$RUNNER_TEMP/data" --quarter "$QUARTER" \
            --evals-from-git --output "docs/reports/adoption-$QUARTER.md"
      - name: Open a PR
        env:
          GH_TOKEN: ${{ github.token }}
          QUARTER: ${{ steps.q.outputs.quarter }}
        run: |
          branch="report/adoption-$QUARTER"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add "docs/reports/adoption-$QUARTER.md"
          git commit -m "docs: adoption report $QUARTER"
          git push --force-with-lease origin "$branch"
          gh pr create --base main --head "$branch" --title "Adoption report $QUARTER" \
            --body "Generated by the Adoption report workflow. Read it before merging: candidates are prompts for a maintainer decision (GOVERNANCE.md)." \
            || echo "A PR for $branch exists already."
