# Label plugin feedback issues (spec adoption-reporting, "Users can give
# feedback per plugin"). Issue forms can't map a dropdown to a label, so this
# reads the form's "Plugin" answer and adds `plugin:<name>`. The answer is
# user input: it is used only when it names an existing plugin folder.
name: Feedback label

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write
  contents: read

jobs:
  label:
    if: contains(github.event.issue.labels.*.name, 'feedback')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const body = context.payload.issue.body || "";
            const m = body.match(/^### Plugin\s*\n+\s*(\S+)\s*$/m);
            const name = m ? m[1] : "";
            if (!/^[a-z0-9][a-z0-9-]{0,63}$/.test(name)) { core.info("no plugin named"); return; }
            const { owner, repo } = context.repo;
            try {
              await github.rest.repos.getContent({ owner, repo, path: `plugins/${name}/catalog.yaml` });
            } catch (e) { core.info(`not a plugin: ${name}`); return; }
            const label = `plugin:${name}`;
            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (e) {
              await github.rest.issues.createLabel({ owner, repo, name: label, color: "1d76db",
                description: `Feedback and issues for ${name}` });
            }
            await github.rest.issues.addLabels({ owner, repo, issue_number: context.issue.number, labels: [label] });
