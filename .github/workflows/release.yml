# One release for every plugin and the installer (RELEASING.md; spec
# release-train).
#
#   v<version>   e.g. v5.0.0 or the candidate v5.1.0rc1. The version must equal
#                installer/pyproject.toml, every plugin.json must carry it (a
#                candidate as 5.1.0-rc.1), and it must be greater than 3.0.0.
#                The run builds every plugin's archives and the installer's
#                wheel and sdist, creates one GitHub release, publishes to PyPI
#                (a candidate to TestPyPI) by trusted publishing once a
#                maintainer approves, and then moves stable (not for a
#                candidate).
#
# Older tags (v1.1.0 to v3.0.0, rf-agentskills-v*, <plugin>--v*,
# robotframework-plugins-v*) are history: the first job refuses them, so they
# publish nothing.
name: Release

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: read

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      candidate: ${{ steps.tag.outputs.candidate }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check the tag against the release version
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys
          from pathlib import Path

          tag = os.environ["TAG"]
          m = re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)(?:rc(\d+))?", tag)
          if not m:
              sys.exit(f"::error::{tag} is not v<MAJOR.MINOR.PATCH> or v<MAJOR.MINOR.PATCH>rc<N>")
          if tuple(int(m.group(i)) for i in (1, 2, 3)) <= (3, 0, 0):
              sys.exit(f"::error::{tag} is not greater than 3.0.0; v1.1.0 to v3.0.0 are the old rf-agentskills tags")
          version = tag[1:]
          have = re.search(r'^version = "([^"]+)"', Path("installer/pyproject.toml").read_text(), re.M).group(1)
          if have != version:
              sys.exit(f"::error::{tag} says {version}, installer/pyproject.toml says {have}")
          rc = m.group(4)
          plugin_version = f"{m.group(1)}.{m.group(2)}.{m.group(3)}-rc.{rc}" if rc else version
          for pj in sorted(Path("plugins").glob("*/.claude-plugin/plugin.json")):
              got = json.loads(pj.read_text()).get("version")
              if got != plugin_version:
                  sys.exit(f"::error::{tag} says {plugin_version}, {pj} says {got}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"version={version}\ncandidate={'yes' if rc else ''}\n")
          PY

  ci:
    name: Run CI
    needs: check
    uses: ./.github/workflows/ci.yml

  release:
    name: Build and create the release
    needs: [check, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: pip install robotframework pyyaml "jsonschema>=4.18" twine
      - name: Check drift and the catalogue
        run: |
          bash scripts/check-drift.sh
          python scripts/build-catalog.py --check
      # First: --clean empties dist/, so it must run before the plugin archives
      # are written there (v5.0.0 lost them that way).
      - name: Build the wheel and sdist
        run: bash scripts/build-packages.sh --clean --check
      - name: Build the plugin archives
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          mkdir -p dist
          for plugin in $(python3 -c 'import json; print(" ".join(p["name"] for p in json.load(open(".claude-plugin/marketplace.json"))["plugins"]))'); do
            # The plugin as installed: without its own tests/ and evals/ (not
            # the example tests/ in skills).
            tar -czf "dist/$plugin-$VERSION.tar.gz" -C plugins \
              --exclude="$plugin/tests" --exclude="$plugin/evals" "$plugin"
            # Standalone skill folders with plain script paths.
            python scripts/export-skills.py "$plugin" "skills-$plugin"
            tar -czf "dist/$plugin-skills-$VERSION.tar.gz" -C "skills-$plugin" .
          done
          # One Claude Desktop / claude.ai upload archive per skill; skill
          # names are unique across the catalogue.
          python scripts/build-skill-zips.py --plugin all --out dist
      - name: Write the release notes
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: python scripts/build-catalog.py --release-notes "$VERSION" > notes.md
      - name: Create the GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: notes.md
          prerelease: ${{ needs.check.outputs.candidate == 'yes' }}
          # Only the archives: the package build also leaves a .gitignore in dist/.
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.whl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-dist
          path: dist/robotframework_plugins-*

  publish:
    name: Publish to ${{ needs.check.outputs.candidate == 'yes' && 'TestPyPI' || 'PyPI' }}
    needs: [check, release]
    runs-on: ubuntu-latest
    # Trusted publishing: PyPI accepts this workflow's OIDC token for the
    # robotframework-plugins project; no API token exists. The environment is
    # protected, so a maintainer approves each upload.
    environment:
      name: ${{ needs.check.outputs.candidate == 'yes' && 'testpypi' || 'pypi' }}
      url: ${{ needs.check.outputs.candidate == 'yes' && 'https://test.pypi.org/p/robotframework-plugins' || 'https://pypi.org/p/robotframework-plugins' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: installer-dist
          path: dist
      - name: Upload
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          repository-url: ${{ needs.check.outputs.candidate == 'yes' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}

  update-branches:
    name: Move stable
    # After PyPI has the release, so stable never points at an unpublished one;
    # a candidate moves nothing.
    needs: [check, publish]
    if: needs.check.outputs.candidate != 'yes'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Move stable to this release
        run: |
          git checkout -B stable "$GITHUB_REF_NAME"
          git push origin stable --force
