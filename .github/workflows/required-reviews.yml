# Required reviews (spec plugin-trust-tiers; design D9).
#
# CODEOWNERS can require one approval per path. This check requires one from
# each group a PR concerns: the owners of every plugin it touches, the
# Foundation reviewers for verified plugins and tier promotions, and the
# security reviewers for security-relevant paths (.github/governance.yaml).
# It sets the `required-reviews` commit status on the PR head, which branch
# protection requires.
#
# It runs base-branch code only and reads the PR through the API; no PR
# content is checked out or executed. REVIEW_TEAMS_TOKEN must be able to read
# the MarketSquare teams' members (a fine-grained token with Members: read).
name: Required reviews

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_run:
    workflows: [Review relay]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  statuses: write
  actions: read

concurrency:
  group: required-reviews-${{ github.event.pull_request.number || github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the base branch (trusted code)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Find the PR
        id: pr
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            let number = context.payload.pull_request?.number;
            if (!number) {
              const run = context.payload.workflow_run;
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner, repo: context.repo.repo, run_id: run.id });
              const art = data.artifacts.find((a) => a.name === "review-relay");
              if (!art) { core.setFailed("no review-relay artifact"); return; }
              const zip = await github.rest.actions.downloadArtifact({
                owner: context.repo.owner, repo: context.repo.repo, artifact_id: art.id, archive_format: "zip" });
              require("fs").writeFileSync("relay.zip", Buffer.from(zip.data));
              const text = require("child_process").execFileSync("unzip", ["-p", "relay.zip", "pr-number"]).toString().trim();
              if (!/^[0-9]{1,7}$/.test(text)) { core.setFailed(`bad PR number from the relay: ${text}`); return; }
              number = Number(text);
            }
            core.setOutput("number", String(number));
      - name: Build the PR snapshot
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        with:
          github-token: ${{ secrets.REVIEW_TEAMS_TOKEN || github.token }}
          script: |
            const fs = require("fs");
            const { owner, repo } = context.repo;
            const number = Number(process.env.PR_NUMBER);
            const pr = (await github.rest.pulls.get({ owner, repo, pull_number: number })).data;
            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: number, per_page: 100 });
            const reviews = await github.paginate(github.rest.pulls.listReviews, { owner, repo, pull_number: number, per_page: 100 });
            const plugins = new Set();
            for (const f of files) {
              const parts = f.filename.split("/");
              if (parts.length > 2 && (parts[0] === "plugins" || parts[0] === "bundles")) plugins.add(parts[1]);
            }
            async function catalog(name, ref) {
              try {
                const { data } = await github.rest.repos.getContent({ owner, repo, path: `plugins/${name}/catalog.yaml`, ref });
                return Buffer.from(data.content, "base64").toString("utf8");
              } catch (e) { return null; }
            }
            const base = {}, head = {};
            for (const name of plugins) {
              const b = await catalog(name, pr.base.sha); if (b !== null) base[name] = b;
              const h = await catalog(name, pr.head.sha); if (h !== null) head[name] = h;
            }
            const gov = fs.readFileSync(".github/governance.yaml", "utf8");
            const slug = (key) => (gov.match(new RegExp(`^\\s*${key}:\\s*(\\S+)`, "m")) || [])[1];
            const teams = {};
            for (const key of ["foundation", "security"]) {
              const [org, team_slug] = (slug(key) || "/").split("/");
              try {
                const members = await github.paginate(github.rest.teams.listMembersInOrg, { org, team_slug, per_page: 100 });
                teams[key] = members.map((m) => m.login);
              } catch (e) {
                core.warning(`cannot read team ${org}/${team_slug}: ${e.message}`);
                teams[key] = [];
              }
            }
            const snapshot = {
              author: pr.user.login, head_sha: pr.head.sha,
              files: files.map((f) => ({ filename: f.filename, status: f.status, patch: f.patch || "" })),
              reviews: reviews.map((r) => ({ user: r.user && r.user.login, state: r.state, submitted_at: r.submitted_at })),
              base_catalogs: base, head_catalogs: head, teams,
            };
            fs.writeFileSync("snapshot.json", JSON.stringify(snapshot));
            core.exportVariable("HEAD_SHA", pr.head.sha);
      - name: Decide
        id: decide
        run: |
          status=0
          python3 scripts/required-reviews.py snapshot.json --summary summary.md || status=$?
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Set the commit status
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          STATUS: ${{ steps.decide.outputs.status }}
        with:
          script: |
            const ok = process.env.STATUS === "0";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: process.env.HEAD_SHA,
              state: ok ? "success" : "pending", context: "required-reviews",
              description: ok ? "Every required group approved" : "Waiting for approvals (see the run summary)",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
