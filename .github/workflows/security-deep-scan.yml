# Model-assisted security scan (spec content-security-scanning, "Model-assisted
# scans run only after maintainer approval"; design D6).
#
# Sends plugin content to a model provider, so it runs only when a maintainer
# labels a PR `security-deep-scan`, and on pushes to main. It runs with the
# model key, so the PR is DATA only:
#   - the scripts, scanners and settings come from the base branch;
#   - the PR head is checked out into ./pr without credentials, and nothing in
#     it is installed or executed; the scanners only read it;
#   - every action is pinned to a commit SHA.
# A new push to the PR does not rerun the scan: a maintainer applies the label
# again after reviewing the new commits.
name: Security deep scan

on:
  pull_request_target:
    types: [labeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-deep-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deep-scan:
    name: Deep scan
    if: github.event_name == 'push' || github.event.label.name == 'security-deep-scan'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out the base branch (trusted code)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
          path: base
      - name: Check out the PR head as data
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
          path: pr
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: pip install pyyaml
      - name: Mark the scan as pending
        if: github.event_name == 'pull_request_target'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: process.env.HEAD_SHA,
              state: "pending", context: "security-deep-scan", description: "Model-assisted scan running",
            });
      - name: Install the pinned scanners
        run: base/scripts/install-scanners.sh "$RUNNER_TEMP/scanners"
      - name: Choose plugins
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          tree=base
          if [ -d pr ]; then
            tree=pr
            git -C pr diff --name-only "$BASE_SHA...HEAD" > "$RUNNER_TEMP/changed.txt" || true
            python3 base/scripts/select-plugin-tests.py --security --root pr \
              --paths-file "$RUNNER_TEMP/changed.txt" --github-output "$GITHUB_OUTPUT"
          else
            python3 base/scripts/select-plugin-tests.py --security --root base --github-output "$GITHUB_OUTPUT"
          fi
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
      - name: Scan with the model passes
        id: scan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.SECURITY_SCAN_ANTHROPIC_API_KEY }}
          SECURITY_SCAN_MODEL: ${{ vars.SECURITY_SCAN_MODEL || 'claude-sonnet-5-5' }}
          SCANNERS: ${{ runner.temp }}/scanners/bin
          SCAN_ROOT: ${{ github.workspace }}/${{ steps.select.outputs.tree }}
          PLUGINS: ${{ steps.select.outputs.plugins }}
        run: |
          status=0
          report="$RUNNER_TEMP/deep-scan.md"
          echo "Model-assisted scan of \`${HEAD_SHA:0:7}\` with $SECURITY_SCAN_MODEL." > "$report"
          for plugin in $(python3 -c 'import json, os; print(" ".join(json.loads(os.environ["PLUGINS"])))'); do
            base/scripts/security-scan.sh "$plugin" "$RUNNER_TEMP/scan/$plugin" --deep || status=1
            { echo; cat "$RUNNER_TEMP/scan/$plugin/summary.md"; } >> "$report"
          done
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sarif-deep-scan
          path: ${{ runner.temp }}/scan/*/*.sarif
          if-no-files-found: warn
      - name: Comment and set the status
        if: always() && github.event_name == 'pull_request_target'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          SCAN_STATUS: ${{ steps.scan.outputs.status }}
        with:
          script: |
            const fs = require("fs");
            const path = `${process.env.RUNNER_TEMP}/deep-scan.md`;
            let body = fs.existsSync(path) ? fs.readFileSync(path, "utf8") : "The deep scan did not finish; see the run log.";
            if (body.length > 60000) body = body.slice(0, 60000) + "\n\n(Cut short; the full report is in the job summary.)";
            const ok = process.env.SCAN_STATUS === "0";
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
              body: `### Security deep scan: ${ok ? "passed" : "failed"}\n\n${body}`,
            });
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: process.env.HEAD_SHA,
              state: ok ? "success" : "failure", context: "security-deep-scan",
              description: ok ? "No new HIGH or CRITICAL findings" : "New HIGH or CRITICAL findings, or a baseline problem",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
      - name: Fail on new findings
        if: steps.scan.outputs.status != '0'
        run: exit 1
