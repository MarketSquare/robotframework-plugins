# Model-assisted security scan (spec content-security-scanning, "Model-assisted
# scans run only after maintainer approval"; design D6, D9).
#
# Sends plugin content to a model provider, so it runs only when a maintainer
# starts it for a PR (Actions > Security deep scan > Run workflow, or
# `gh workflow run security-deep-scan.yml -f pr=<number>`), and on pushes to
# main. Only people with write access can start a workflow. It runs with the
# model key, so the PR is DATA only:
#   - the scripts, scanners and settings come from the branch the run starts on;
#   - the PR head is fetched into ./pr with plain git, without credentials, and
#     nothing in it is installed or executed; the scanners only read it;
#   - with `sha`, the run refuses a PR whose head moved after the review;
#   - every action is pinned to a commit SHA.
# A new push to the PR does not rerun the scan: a maintainer starts it again
# after reviewing the new commits.
#
# On main the model passes only report: their findings change from run to run
# and can't be baselined. The static scanners gate every PR and the nightly
# run of security-gate.yml. A PR scan comments its findings and sets a failing
# `security-deep-scan` status on a new HIGH or CRITICAL one.
name: Security deep scan

on:
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to scan (empty scans main)
        required: false
        type: string
      sha:
        description: The PR head commit you reviewed (optional; the scan stops if the PR moved on)
        required: false
        type: string
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-deep-scan-${{ inputs.pr || github.ref }}
  cancel-in-progress: true

jobs:
  deep-scan:
    name: Deep scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    env:
      PR: ${{ inputs.pr }}
    steps:
      - name: Check out the trusted scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          path: base
      - name: Look up the PR
        id: pr
        if: inputs.pr
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_SHA: ${{ inputs.sha }}
        run: |
          case "$PR" in ''|*[!0-9]*) echo "::error::pr must be a PR number, got '$PR'"; exit 1 ;; esac
          read -r state head base < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" \
            --jq '"\(.state) \(.head.sha) \(.base.sha)"')
          [ "$state" = open ] || { echo "::error::PR #$PR is $state"; exit 1; }
          if [ -n "$REVIEWED_SHA" ] && [ "$head" != "$REVIEWED_SHA" ]; then
            echo "::error::PR #$PR is at ${head:0:7}, not the reviewed ${REVIEWED_SHA:0:7}; review the new commits and start the scan again"
            exit 1
          fi
          { echo "head=$head"; echo "base=$base"; } >> "$GITHUB_OUTPUT"
      - name: Fetch the PR head as data
        if: inputs.pr
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head }}
          BASE_SHA: ${{ steps.pr.outputs.base }}
        run: |
          git init -q pr
          git -C pr fetch -q --no-tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            "+refs/pull/$PR/head:refs/remotes/pr/head" "$BASE_SHA"
          got=$(git -C pr rev-parse refs/remotes/pr/head)
          [ "$got" = "$HEAD_SHA" ] || { echo "::error::fetched ${got:0:7}, expected ${HEAD_SHA:0:7}; the PR moved on"; exit 1; }
          git -C pr -c advice.detachedHead=false checkout -q "$HEAD_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: pip install pyyaml
      - name: Mark the scan as pending
        if: inputs.pr
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: process.env.HEAD_SHA,
              state: "pending", context: "security-deep-scan", description: "Model-assisted scan running",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
      - name: Install the pinned scanners
        run: base/scripts/install-scanners.sh "$RUNNER_TEMP/scanners"
      - name: Choose plugins
        id: select
        env:
          BASE_SHA: ${{ steps.pr.outputs.base }}
        run: |
          tree=base
          if [ -d pr ]; then
            tree=pr
            git -C pr diff --name-only "$BASE_SHA...HEAD" > "$RUNNER_TEMP/changed.txt"
            python3 base/scripts/select-plugin-tests.py --security --root pr \
              --paths-file "$RUNNER_TEMP/changed.txt" --github-output "$GITHUB_OUTPUT"
          else
            python3 base/scripts/select-plugin-tests.py --security --root base --github-output "$GITHUB_OUTPUT"
          fi
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
      - name: Scan with the model passes
        id: scan
        env:
          # A key of its own, with its own credit limit, so the scan can't
          # spend the eval budget.
          SECURITY_SCAN_PROVIDER: openrouter
          SECURITY_SCAN_OPENROUTER_API_KEY: ${{ secrets.SECURITY_SCAN_OPENROUTER_API_KEY }}
          SECURITY_SCAN_MODEL: ${{ vars.SECURITY_SCAN_MODEL || 'z-ai/glm-5.3-flash' }}
          SCANNERS: ${{ runner.temp }}/scanners/bin
          SCAN_ROOT: ${{ github.workspace }}/${{ steps.select.outputs.tree }}
          PLUGINS: ${{ steps.select.outputs.plugins }}
          HEAD_SHA: ${{ steps.pr.outputs.head || github.sha }}
        run: |
          # 0: no new HIGH or CRITICAL; findings: some (fatal for a PR only);
          # broken: a scan stopped before writing its summary (fatal always).
          status=0
          report="$RUNNER_TEMP/deep-scan.md"
          if [ -z "$SECURITY_SCAN_OPENROUTER_API_KEY" ]; then
            # No model key: say so instead of failing every push to main. Not
            # a passing result; the PR gate's static scans still ran.
            echo "**Not run:** the repository has no \`SECURITY_SCAN_OPENROUTER_API_KEY\` secret, so the model passes can't run. This is not a passing result." > "$report"
            echo "::warning::deep scan not run: no SECURITY_SCAN_OPENROUTER_API_KEY secret"
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
            echo "status=not-run" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Model-assisted scan of \`${HEAD_SHA:0:7}\` with $SECURITY_SCAN_MODEL." > "$report"
          for plugin in $(python3 -c 'import json, os; print(" ".join(json.loads(os.environ["PLUGINS"])))'); do
            rc=0
            base/scripts/security-scan.sh "$plugin" "$RUNNER_TEMP/scan/$plugin" --deep || rc=$?
            summary="$RUNNER_TEMP/scan/$plugin/summary.md"
            if [ -f "$summary" ] && [ "$rc" -le 1 ]; then
              { echo; cat "$summary"; } >> "$report"
              if [ "$rc" = 1 ] && [ "$status" = 0 ]; then
                status=findings
                if [ -z "$PR" ]; then
                  echo "::warning::deep scan: new findings in $plugin, reported only on main; see the job summary"
                fi
              fi
            else
              printf '\n## Security gate: %s, failed\n\nThe scan stopped before writing a summary; see the run log.\n' "$plugin" >> "$report"
              status=broken
            fi
          done
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sarif-deep-scan
          path: ${{ runner.temp }}/scan/*/*.sarif
          if-no-files-found: warn
      - name: Comment and set the status
        if: always() && inputs.pr && steps.pr.outputs.head
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          SCAN_STATUS: ${{ steps.scan.outputs.status }}
          HEAD_SHA: ${{ steps.pr.outputs.head }}
        with:
          script: |
            const fs = require("fs");
            const path = `${process.env.RUNNER_TEMP}/deep-scan.md`;
            let body = fs.existsSync(path) ? fs.readFileSync(path, "utf8") : "The deep scan did not finish; see the run log.";
            if (body.length > 60000) body = body.slice(0, 60000) + "\n\n(Cut short; the full report is in the job summary.)";
            const ok = process.env.SCAN_STATUS === "0";
            const notRun = process.env.SCAN_STATUS === "not-run";
            const broken = !ok && !notRun && process.env.SCAN_STATUS !== "findings";
            const verdict = ok ? "passed" : notRun ? "not run" : "failed";
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: Number(process.env.PR),
              body: `### Security deep scan of ${process.env.HEAD_SHA.slice(0, 7)}: ${verdict}\n\n${body}`,
            });
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha: process.env.HEAD_SHA,
              state: ok ? "success" : notRun ? "error" : "failure", context: "security-deep-scan",
              description: ok ? "No new HIGH or CRITICAL findings"
                : notRun ? "Not run: no model key configured"
                : broken ? "The scan did not finish; see the run log"
                : "New HIGH or CRITICAL findings, or a baseline problem",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
      - name: Fail on new findings in a PR, or on a broken scan
        if: steps.scan.outputs.status == 'broken' || (inputs.pr && steps.scan.outputs.status == 'findings')
        run: exit 1
