name: Skill Evaluation

# Tiered skill evaluation (strengthen-skill-eval-harness, ADR-005):
#   PR       -> per plugin with changes: narrow tier, treatment arm only, N=3, Haiku,
#               scoped to the changed skills + `plugin` canaries, gated against
#               plugins/<plugin>/evals/baselines/narrow.json; validation-split
#               trigger evals when a SKILL.md description changed.
# Every plugin with an evals/ folder is a matrix leg; each leg stages all
# content plugins (a full install) and uses only its own tasks and baselines.
#   weekly   -> all tiers in both arms, N=3, all trigger sets, candidate baseline.
#               The partial tier (only rf-core staged) runs like narrow.
#   manual   -> same as weekly with model / runs / allow_opus inputs.
# Every harness invocation carries an explicit --max-cost-usd cap.
#
# Provider (openrouter-ci-eval-tier): when the OPENROUTER_API_KEY secret is set,
# PR and weekly runs use the OpenRouter tier (DeepSeek V4.1 Flash, turn-limit
# factor 1.5) and gate against plugins/<plugin>/evals/baselines/openrouter/
# deepseek-v4.1-flash/. Claude runs are a manual dispatch (provider: claude).

on:
  pull_request:
    paths:
      - 'plugins/**'
      # The plugins' own pytest suites are CI's job, not a reason for agent runs.
      - '!plugins/*/tests/**'
      - 'eval/**'
      - 'src/rf_skill_eval/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/skill-evaluation.yml'
  schedule:
    # Sunday 04:00 UTC - off-hours weekly run per ADR-005
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      provider:
        description: "openrouter (DeepSeek, the CI default when its key is set) or claude"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - "openrouter"
          - "claude"
      tiers:
        description: "Comma list of tiers"
        required: true
        default: "narrow,realistic,adversarial,partial"
        type: string
      arms:
        description: "Arms to run"
        required: true
        default: "treatment,baseline"
        type: choice
        options:
          - "treatment,baseline"
          - "treatment"
          - "baseline"
      model:
        description: "Claude runs only: override every task's model (empty = tier defaults: narrow Haiku, realistic/adversarial Sonnet)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - "claude-haiku-5-5"
          - "claude-sonnet-5-5"
          - "claude-opus-5-5"
      runs:
        description: "Replicates per task x arm"
        required: true
        default: "3"
        type: string
      allow_opus:
        description: "Opt in to claude-opus-5-5 (manual runs only; needs a cost cap)"
        required: false
        default: false
        type: boolean
      max_cost_usd:
        description: "Cost cap in USD per harness invocation (each tier, triggers)"
        required: true
        default: "15"
        type: string
      triggers:
        description: "Also run all trigger sets (both splits)"
        required: false
        default: true
        type: boolean
      use_api_key:
        description: "Fall back to ANTHROPIC_API_KEY instead of OAuth token"
        required: false
        default: false
        type: boolean

concurrency:
  group: skill-eval-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  HAIKU_MODEL: claude-haiku-5-5
  OPENROUTER_MODEL: deepseek/deepseek-v4.1-flash
  OPENROUTER_TURNS_FACTOR: "1.5"
  # OpenRouter caps (priced at list prices, an upper bound); the key's credit
  # limit on OpenRouter is the hard cap. Tune after the first weekly run.
  PR_NARROW_CAP_USD_OPENROUTER: "2"
  PR_TRIGGER_CAP_USD_OPENROUTER: "2"
  WEEKLY_CAP_USD_OPENROUTER: "3"
  # Initial caps (design D9 open question) - tune after the first weekly run.
  PR_NARROW_CAP_USD: "10"
  PR_TRIGGER_CAP_USD: "20"
  WEEKLY_NARROW_CAP_USD: "12"
  WEEKLY_REALISTIC_CAP_USD: "12"
  WEEKLY_ADVERSARIAL_CAP_USD: "8"
  WEEKLY_PARTIAL_CAP_USD: "4"
  WEEKLY_TRIGGER_CAP_USD: "8"

jobs:
  preflight:
    name: Preflight (validate + select)
    runs-on: ubuntu-24.04  # ubuntu-latest (26.04) has no Playwright chromium yet
    timeout-minutes: 15
    outputs:
      has_credentials: ${{ steps.creds.outputs.has_credentials }}
      # openrouter | claude, and what goes with it (openrouter-ci-eval-tier D6).
      provider: ${{ steps.creds.outputs.provider }}
      model: ${{ steps.creds.outputs.model }}
      turns_factor: ${{ steps.creds.outputs.turns_factor }}
      baseline_subdir: ${{ steps.creds.outputs.baseline_subdir }}
      run_evals: ${{ steps.select.outputs.run_evals }}
      # JSON list of {plugin, skills, full_tier, run_triggers, trigger_skills},
      # one per plugin whose evals must run.
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install harness
        run: uv sync --all-packages

      - name: Validate tasks, trigger sets and coverage (no API calls)
        run: |
          for evals in plugins/*/evals; do
            plugin=$(basename "$(dirname "$evals")")
            uv run rf-skill-eval --plugin "$plugin" validate-tasks
            uv run rf-skill-eval --plugin "$plugin" coverage
          done

      # Live evals run plugin hooks and scripts with an API key, so they run only
      # on code a maintainer pushed: main, schedules, manual runs, and PRs whose
      # head branch is in this repository (content-security-scanning, "Untrusted
      # plugin content is never executed with secrets"). A fork PR never counts
      # as having credentials, whatever the repository's fork-secrets setting.
      - name: Detect credentials
        id: creds
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.provider || '' }}
          FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ "${FORK_PR}" = "true" ]; then
            echo "has_credentials=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          has_or=""; has_claude=""
          [ -n "${OPENROUTER_API_KEY}" ] && has_or=yes
          { [ -n "${CLAUDE_CODE_OAUTH_TOKEN}" ] || [ -n "${ANTHROPIC_API_KEY}" ]; } && has_claude=yes
          case "${REQUESTED}" in
            openrouter) provider=openrouter; [ -n "$has_or" ] || provider="" ;;
            claude) provider=claude; [ -n "$has_claude" ] || provider="" ;;
            *) if [ -n "$has_or" ]; then provider=openrouter; elif [ -n "$has_claude" ]; then provider=claude; else provider=""; fi ;;
          esac
          if [ -z "$provider" ]; then
            echo "has_credentials=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_credentials=true" >> "$GITHUB_OUTPUT"
          echo "provider=$provider" >> "$GITHUB_OUTPUT"
          if [ "$provider" = "openrouter" ]; then
            echo "model=${OPENROUTER_MODEL}" >> "$GITHUB_OUTPUT"
            echo "turns_factor=${OPENROUTER_TURNS_FACTOR}" >> "$GITHUB_OUTPUT"
            echo "baseline_subdir=openrouter/${OPENROUTER_MODEL#*/}/" >> "$GITHUB_OUTPUT"
          else
            echo "model=${HAIKU_MODEL}" >> "$GITHUB_OUTPUT"
            echo "turns_factor=1.0" >> "$GITHUB_OUTPUT"
            echo "baseline_subdir=" >> "$GITHUB_OUTPUT"
          fi

      - name: Map changed paths to skills, per plugin
        id: select
        run: |
          legs="${RUNNER_TEMP}/legs"
          mkdir -p "$legs"
          for evals in plugins/*/evals; do
            plugin=$(basename "$(dirname "$evals")")
            out="$legs/$plugin.env"
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              uv run rf-skill-eval --plugin "$plugin" preflight \
                --base "origin/${{ github.base_ref }}" \
                --github-output "$out"
            else
              printf 'run_evals=true\nfull_tier=true\nskills=\nrun_triggers=true\ntrigger_skills=\n' > "$out"
            fi
          done
          python3 - "$legs" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          from pathlib import Path
          legs = []
          for f in sorted(Path(sys.argv[1]).glob("*.env")):
              values = dict(line.split("=", 1) for line in f.read_text().splitlines() if "=" in line)
              if values.get("run_evals") == "true":
                  legs.append({"plugin": f.stem, **{k: values.get(k, "") for k in
                               ("skills", "full_tier", "run_triggers", "trigger_skills")}})
          print(f"run_evals={'true' if legs else 'false'}")
          print(f"matrix={json.dumps(legs)}")
          PY

  harness-tests:
    name: Harness unit tests (no API calls)
    runs-on: ubuntu-24.04  # ubuntu-latest (26.04) has no Playwright chromium yet
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install harness + grader libraries
        run: uv sync --all-packages

      - name: Initialize Playwright browsers (golden-solution grading)
        run: uv run rfbrowser init

      - name: Lint and type-check
        run: |
          uv run ruff check src tests/eval
          uv run mypy

      - name: pytest tests/eval
        # Fakes and recorded transcripts only; RF_SKILL_EVAL_AUTOLOAD_DOTENV=0 and
        # no secrets, so nothing can reach a model.
        env:
          RF_SKILL_EVAL_AUTOLOAD_DOTENV: "0"
        run: uv run pytest tests/eval -q

  not-run:
    name: Evaluation not run (no credentials)
    needs: preflight
    if: ${{ needs.preflight.outputs.has_credentials != 'true' && needs.preflight.outputs.run_evals == 'true' }}
    runs-on: ubuntu-24.04  # ubuntu-latest (26.04) has no Playwright chromium yet
    timeout-minutes: 5
    steps:
      - name: Report
        run: |
          echo "::notice::not run: no credentials (fork PR or missing secrets) - no evaluation result was produced"
          {
            echo "## Skill evaluation"
            echo
            echo "**not run: no credentials** - this is not a passing result."
          } >> "$GITHUB_STEP_SUMMARY"

  pr-eval:
    name: PR eval ${{ matrix.plugin }} (narrow, treatment, N=3, ${{ needs.preflight.outputs.provider }})
    needs: preflight
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.preflight.outputs.run_evals == 'true' && needs.preflight.outputs.has_credentials == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    env:
      RF_EVAL_PLUGIN: ${{ matrix.plugin }}
      EVALS: plugins/${{ matrix.plugin }}/evals
      PROVIDER: ${{ needs.preflight.outputs.provider }}
      EVAL_MODEL: ${{ needs.preflight.outputs.model }}
      TURNS_FACTOR: ${{ needs.preflight.outputs.turns_factor }}
      BASELINES: plugins/${{ matrix.plugin }}/evals/baselines/${{ needs.preflight.outputs.baseline_subdir }}
    runs-on: ubuntu-24.04  # ubuntu-latest (26.04) has no Playwright chromium yet
    # A harness-wide PR selects the full narrow tier (66 sequential sessions)
    # plus trigger evals for every changed description; 90 min was not enough.
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Claude Code requires Node >= 22; on Node 20 npm silently resolves
          # the newest compatible release (2.1.197), not the current one.
          node-version: "22"

      - name: Install Claude Code CLI
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Install Python dependencies
        run: uv sync --all-packages

      - name: Initialize Playwright browsers
        run: uv run rfbrowser init

      - name: Doctor (grader tools for the narrow tier)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ needs.preflight.outputs.provider == 'claude' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          ANTHROPIC_API_KEY: ${{ needs.preflight.outputs.provider == 'claude' && secrets.ANTHROPIC_API_KEY || '' }}
          OPENROUTER_API_KEY: ${{ needs.preflight.outputs.provider == 'openrouter' && secrets.OPENROUTER_API_KEY || '' }}
        run: uv run rf-skill-eval doctor --provider "$([ "${PROVIDER}" = openrouter ] && echo openrouter || echo anthropic)" --tasks-dir ${EVALS}/tasks/narrow --strict

      - name: Select the cost caps for the provider
        run: |
          if [ "${PROVIDER}" = "openrouter" ]; then
            echo "NARROW_CAP=${PR_NARROW_CAP_USD_OPENROUTER}" >> "$GITHUB_ENV"
            echo "TRIGGER_CAP=${PR_TRIGGER_CAP_USD_OPENROUTER}" >> "$GITHUB_ENV"
          else
            echo "NARROW_CAP=${PR_NARROW_CAP_USD}" >> "$GITHUB_ENV"
            echo "TRIGGER_CAP=${PR_TRIGGER_CAP_USD}" >> "$GITHUB_ENV"
          fi

      - name: Spend before (OpenRouter key)
        if: ${{ env.PROVIDER == 'openrouter' }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python3 scripts/openrouter-ci.py spend | tee "${RUNNER_TEMP}/spend-before.json" || true

      - name: Smoke test (one OpenRouter session)
        if: ${{ env.PROVIDER == 'openrouter' }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: uv run python scripts/openrouter-ci.py smoke "${EVAL_MODEL}"

      - name: Run narrow tier (treatment arm)
        id: batch
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ needs.preflight.outputs.provider == 'claude' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          ANTHROPIC_API_KEY: ${{ needs.preflight.outputs.provider == 'claude' && secrets.ANTHROPIC_API_KEY || '' }}
          OPENROUTER_API_KEY: ${{ needs.preflight.outputs.provider == 'openrouter' && secrets.OPENROUTER_API_KEY || '' }}
          SKILLS: ${{ matrix.skills }}
        run: |
          set +e
          SKILL_ARGS=()
          if [ -n "${SKILLS}" ]; then SKILL_ARGS=(--skills "${SKILLS}"); fi
          uv run rf-skill-eval run-batch \
            --tasks-dir ${EVALS}/tasks/narrow \
            --tier narrow \
            "${SKILL_ARGS[@]}" \
            --arms treatment \
            --runs 3 \
            --model "${EVAL_MODEL}" \
            --max-turns-factor "${TURNS_FACTOR}" \
            --max-cost-usd "${NARROW_CAP}" \
            --output "${RUNNER_TEMP}"/eval-runs/pr
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Gate against stored baseline
        id: gate
        if: always()
        run: |
          set +e
          uv run rf-skill-eval gate \
            --runs-dir "${RUNNER_TEMP}"/eval-runs/pr \
            --baseline "${BASELINES}narrow.json" \
            --tasks-dir ${EVALS}/tasks \
            --token-budget 0.75 \
            --max-cost-usd "${NARROW_CAP}" \
            --report-output gate.txt
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Trigger evals (validation split, changed descriptions)
        id: triggers
        if: ${{ always() && matrix.run_triggers == 'true' }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ needs.preflight.outputs.provider == 'claude' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          ANTHROPIC_API_KEY: ${{ needs.preflight.outputs.provider == 'claude' && secrets.ANTHROPIC_API_KEY || '' }}
          OPENROUTER_API_KEY: ${{ needs.preflight.outputs.provider == 'openrouter' && secrets.OPENROUTER_API_KEY || '' }}
          TRIGGER_SKILLS: ${{ matrix.trigger_skills }}
        run: |
          set +e
          uv run rf-skill-eval trigger \
            --skills "${TRIGGER_SKILLS}" \
            --split validation \
            --model "${EVAL_MODEL}" \
            --concurrency 2 \
            --max-cost-usd "${TRIGGER_CAP}" \
            --output "${RUNNER_TEMP}"/eval-runs/triggers
          code=$?
          uv run rf-skill-eval gate \
            --trigger-results "${RUNNER_TEMP}"/eval-runs/triggers/trigger-results.json \
            --trigger-baseline "${BASELINES}triggers.json" \
            --report-output trigger-gate.txt
          gate=$?
          if [ "$code" -ne 0 ]; then echo "exit_code=$code" >> "$GITHUB_OUTPUT"; else echo "exit_code=$gate" >> "$GITHUB_OUTPUT"; fi

      - name: Spend after (OpenRouter key)
        if: ${{ always() && env.PROVIDER == 'openrouter' }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python3 scripts/openrouter-ci.py spend | tee "${RUNNER_TEMP}/spend-after.json" || true
          python3 scripts/openrouter-ci.py summary "${RUNNER_TEMP}/spend-before.json" \
            "${RUNNER_TEMP}/spend-after.json" "${RUNNER_TEMP}/eval-runs" --out spend.md || true

      - name: Render report
        if: always()
        run: |
          uv run rf-skill-eval report \
            --runs-dir "${RUNNER_TEMP}"/eval-runs/pr \
            --tasks-dir ${EVALS}/tasks \
            --baseline "${BASELINES}narrow.json" \
            --format md \
            --output eval-report.md || echo "_no report (no runs recorded)_" > eval-report.md
          {
            echo "Model: \`${EVAL_MODEL}\` (provider ${PROVIDER}, turn-limit factor ${TURNS_FACTOR})"
            echo
            cat spend.md 2>/dev/null || true
            echo '### Gate'
            echo '```'
            cat gate.txt 2>/dev/null || echo "gate did not run"
            echo '```'
            if [ -f trigger-gate.txt ]; then
              echo '### Trigger gate'
              echo '```'
              cat trigger-gate.txt
              echo '```'
              cat "${RUNNER_TEMP}"/eval-runs/triggers/trigger-report.md 2>/dev/null || true
            fi
            echo
            cat eval-report.md
          } > pr-comment.md
          cat pr-comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evaluation artifacts
        if: always()
        # Agent-created workspace venvs/node_modules made this artifact 5 GB;
        # transcripts, verdicts and configs are what matter for debugging.
        uses: actions/upload-artifact@v4
        with:
          name: skill-eval-pr-${{ matrix.plugin }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/eval-runs/pr
            ${{ runner.temp }}/eval-runs/triggers
            ${{ runner.temp }}/spend-*.json
            eval-report.md
            gate.txt
            trigger-gate.txt
            !${{ runner.temp }}/eval-runs/**/workspace/.venv
            !${{ runner.temp }}/eval-runs/**/workspace/node_modules
          # v4 silently strips dotfiles by default. We need .mcp.json,
          # .claude/, and other hidden config artifacts visible for
          # post-run debugging.
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30

      - name: Comment PR with report
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- rf-skill-eval-report ${{ matrix.plugin }} -->';
            let body;
            try {
              body = fs.readFileSync('pr-comment.md', 'utf8');
            } catch (err) {
              body = 'Evaluation report missing (run may have failed before report generation).';
            }
            const fullBody = `${marker}\n\n## Skill Evaluation: ${{ matrix.plugin }} (narrow, treatment, N=3, ${{ needs.preflight.outputs.model }})\n\n${body}`.slice(0, 65000);
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: fullBody });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: fullBody });
            }

      - name: Fail on regression, incomplete runs or budget stop
        if: always()
        run: |
          echo "run-batch exit: ${{ steps.batch.outputs.exit_code }}"
          echo "gate exit: ${{ steps.gate.outputs.exit_code }}"
          echo "trigger exit: ${{ steps.triggers.outputs.exit_code }}"
          test "${{ steps.batch.outputs.exit_code }}" = "0"
          test "${{ steps.gate.outputs.exit_code }}" = "0"
          if [ -n "${{ steps.triggers.outputs.exit_code }}" ]; then
            test "${{ steps.triggers.outputs.exit_code }}" = "0"
          fi

  full-eval:
    name: Full eval ${{ matrix.plugin }} (all tiers, both arms, ${{ needs.preflight.outputs.provider }})
    needs: preflight
    if: ${{ github.event_name != 'pull_request' && needs.preflight.outputs.has_credentials == 'true' }}
    strategy:
      fail-fast: false
      # One leg at a time: the weekly caps are per invocation, and parallel
      # legs would multiply the spend and the rate-limit pressure.
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    runs-on: ubuntu-24.04  # ubuntu-latest (26.04) has no Playwright chromium yet
    timeout-minutes: 360
    env:
      RF_EVAL_PLUGIN: ${{ matrix.plugin }}
      EVALS: plugins/${{ matrix.plugin }}/evals
      TIERS: ${{ github.event_name == 'workflow_dispatch' && inputs.tiers || 'narrow,realistic,adversarial,partial' }}
      ARMS: ${{ github.event_name == 'workflow_dispatch' && inputs.arms || 'treatment,baseline' }}
      RUNS: ${{ github.event_name == 'workflow_dispatch' && inputs.runs || '3' }}
      PROVIDER: ${{ needs.preflight.outputs.provider }}
      # OpenRouter: the pinned model for every tier; Claude: the dispatch override
      # (empty = each task's tier default).
      MODEL: ${{ needs.preflight.outputs.provider == 'openrouter' && needs.preflight.outputs.model || (github.event_name == 'workflow_dispatch' && inputs.model || '') }}
      TURNS_FACTOR: ${{ needs.preflight.outputs.turns_factor }}
      BASELINES: plugins/${{ matrix.plugin }}/evals/baselines/${{ needs.preflight.outputs.baseline_subdir }}
      ALLOW_OPUS: ${{ needs.preflight.outputs.provider == 'claude' && github.event_name == 'workflow_dispatch' && inputs.allow_opus || false }}
      MANUAL_CAP: ${{ github.event_name == 'workflow_dispatch' && inputs.max_cost_usd || '' }}
      RUN_TRIGGERS: ${{ github.event_name != 'workflow_dispatch' || inputs.triggers }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Claude Code requires Node >= 22; on Node 20 npm silently resolves
          # the newest compatible release (2.1.197), not the current one.
          node-version: "22"

      - name: Install Claude Code CLI
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Install Python dependencies
        run: uv sync --all-packages

      - name: Initialize Playwright browsers
        run: uv run rfbrowser init

      - name: Set API key fallback
        if: ${{ inputs.use_api_key == true && needs.preflight.outputs.provider == 'claude' }}
        run: echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" >> "$GITHUB_ENV"

      - name: Doctor
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ needs.preflight.outputs.provider == 'claude' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          OPENROUTER_API_KEY: ${{ needs.preflight.outputs.provider == 'openrouter' && secrets.OPENROUTER_API_KEY || '' }}
        run: uv run rf-skill-eval doctor --provider "$([ "${PROVIDER}" = openrouter ] && echo openrouter || echo anthropic)" --tasks-dir ${EVALS}/tasks --strict

      - name: Spend before (OpenRouter key)
        if: ${{ env.PROVIDER == 'openrouter' }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python3 scripts/openrouter-ci.py spend | tee "${RUNNER_TEMP}/spend-before.json" || true

      - name: Smoke test (one OpenRouter session)
        if: ${{ env.PROVIDER == 'openrouter' }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: uv run python scripts/openrouter-ci.py smoke "${MODEL}"

      - name: Run tiers
        id: batch
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ needs.preflight.outputs.provider == 'claude' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          OPENROUTER_API_KEY: ${{ needs.preflight.outputs.provider == 'openrouter' && secrets.OPENROUTER_API_KEY || '' }}
        run: |
          set +e
          overall=0
          MODEL_ARGS=()
          if [ -n "${MODEL}" ]; then MODEL_ARGS=(--model "${MODEL}"); fi
          if [ "${ALLOW_OPUS}" = "true" ]; then MODEL_ARGS+=(--allow-opus); fi
          MODEL_ARGS+=(--max-turns-factor "${TURNS_FACTOR}")
          for tier in ${TIERS//,/ }; do
            case "$tier" in
              narrow) cap="${WEEKLY_NARROW_CAP_USD}" ;;
              realistic) cap="${WEEKLY_REALISTIC_CAP_USD}" ;;
              adversarial) cap="${WEEKLY_ADVERSARIAL_CAP_USD}" ;;
              partial) cap="${WEEKLY_PARTIAL_CAP_USD}" ;;
              *) echo "unknown tier $tier"; exit 2 ;;
            esac
            if [ "${PROVIDER}" = "openrouter" ]; then cap="${WEEKLY_CAP_USD_OPENROUTER}"; fi
            if [ -n "${MANUAL_CAP}" ]; then cap="${MANUAL_CAP}"; fi
            # Not every plugin has every tier (rf-desktop has narrow tasks only).
            if [ ! -d "${EVALS}/tasks/${tier}" ]; then echo "no ${tier} tasks in ${EVALS}"; continue; fi
            uv run rf-skill-eval run-batch \
              --tasks-dir "${EVALS}/tasks/${tier}" \
              --tier "${tier}" \
              --arms "${ARMS}" \
              --runs "${RUNS}" \
              "${MODEL_ARGS[@]}" \
              --max-cost-usd "${cap}" \
              --output "${RUNNER_TEMP}/eval-runs/full/${tier}"
            code=$?
            if [ "$code" -ne 0 ]; then overall=$code; fi
          done
          echo "exit_code=${overall}" >> "$GITHUB_OUTPUT"

      - name: Trigger evals (all sets, both splits)
        id: triggers
        if: ${{ always() && env.RUN_TRIGGERS == 'true' }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ needs.preflight.outputs.provider == 'claude' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          OPENROUTER_API_KEY: ${{ needs.preflight.outputs.provider == 'openrouter' && secrets.OPENROUTER_API_KEY || '' }}
        run: |
          set +e
          cap="${WEEKLY_TRIGGER_CAP_USD}"
          if [ "${PROVIDER}" = "openrouter" ]; then cap="${WEEKLY_CAP_USD_OPENROUTER}"; fi
          if [ -n "${MANUAL_CAP}" ]; then cap="${MANUAL_CAP}"; fi
          MODEL_ARGS=()
          if [ -n "${MODEL}" ]; then MODEL_ARGS=(--model "${MODEL}"); fi
          if [ "${ALLOW_OPUS}" = "true" ]; then MODEL_ARGS+=(--allow-opus); fi
          uv run rf-skill-eval trigger \
            --split train,validation \
            "${MODEL_ARGS[@]}" \
            --max-cost-usd "${cap}" \
            --output "${RUNNER_TEMP}"/eval-runs/full/triggers
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Spend after (OpenRouter key)
        if: ${{ always() && env.PROVIDER == 'openrouter' }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python3 scripts/openrouter-ci.py spend | tee "${RUNNER_TEMP}/spend-after.json" || true
          # Warn when the priced total and the key's spend differ by more than 25%.
          python3 scripts/openrouter-ci.py summary --warn-drift 0.25 --out spend.md \
            "${RUNNER_TEMP}/spend-before.json" "${RUNNER_TEMP}/spend-after.json" \
            "${RUNNER_TEMP}/eval-runs/full" || true
          cat spend.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Candidate baseline and report
        if: always()
        run: |
          uv run rf-skill-eval baseline update \
            --from "${RUNNER_TEMP}"/eval-runs/full \
            --tasks-dir ${EVALS}/tasks \
            --output-dir candidate-baseline || true
          uv run rf-skill-eval report \
            --runs-dir "${RUNNER_TEMP}"/eval-runs/full \
            --tasks-dir ${EVALS}/tasks \
            --format md \
            --output eval-report.md || echo "_no report_" > eval-report.md
          set +e
          uv run rf-skill-eval gate \
            --runs-dir "${RUNNER_TEMP}"/eval-runs/full \
            --baseline "${BASELINES}narrow.json" \
            --tasks-dir ${EVALS}/tasks \
            --report-output gate.txt
          echo "GATE_EXIT=$?" >> "$GITHUB_ENV"
          {
            echo "Model: \`${MODEL:-tier defaults}\` (provider ${PROVIDER}, turn-limit factor ${TURNS_FACTOR})"
            echo
            echo '### Gate vs committed baseline (informational)'
            echo '```'
            cat gate.txt 2>/dev/null
            echo '```'
            cat "${RUNNER_TEMP}"/eval-runs/full/triggers/trigger-report.md 2>/dev/null || true
            cat eval-report.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skill-eval-full-${{ matrix.plugin }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/eval-runs/full
            ${{ runner.temp }}/spend-*.json
            eval-report.md
            gate.txt
            !${{ runner.temp }}/eval-runs/**/workspace/.venv
            !${{ runner.temp }}/eval-runs/**/workspace/node_modules
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload candidate baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # The provider is in the name: the files go to baselines/ (claude) or
          # baselines/openrouter/<model name>/ (openrouter).
          name: candidate-baseline-${{ matrix.plugin }}-${{ needs.preflight.outputs.provider }}-${{ github.run_id }}
          path: candidate-baseline/
          if-no-files-found: ignore
          retention-days: 90

      - name: Open regression issue (weekly)
        if: ${{ always() && github.event_name == 'schedule' && env.GATE_EXIT == '1' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Skill eval weekly regression: ${{ matrix.plugin }} (run ${{ github.run_id }})" \
            --label "eval-regression" \
            --body "The weekly evaluation failed the gate against the committed baseline.

          $(cat gate.txt)

          Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Fail on incomplete runs or budget stop
        if: always()
        run: |
          test "${{ steps.batch.outputs.exit_code }}" = "0"
          if [ -n "${{ steps.triggers.outputs.exit_code }}" ]; then
            test "${{ steps.triggers.outputs.exit_code }}" = "0"
          fi
