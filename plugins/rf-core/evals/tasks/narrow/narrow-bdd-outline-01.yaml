id: narrow-bdd-outline-01
skill: rf-bdd
tier: narrow
description: |
  Specify late-return fines with four examples (ported from author-outline).
  The "on the due date" and "1 day late" rows don't read like the others, so
  an outline sentence fits only some rows. Gated by a green run of at least 4
  tests, step-only test bodies or template rows, living documentation and
  native .robot only. Reported, not gated: no executed step reads "1 days".
prompt: |
  Specify the late return fines of our library service in BDD style:
  returning a book after its due date costs 0.50 EUR per day, and returning
  it on the due date costs nothing. Use these examples: on the due date, 1 day
  late, 7 days late and 30 days late.
model: claude-haiku-5-5
max_turns: 30
timeout_seconds: 600
allowed_tools:
  - Read
  - Write
  - Edit
  - Bash
  - Glob
  - Grep
  - Skill
grader_checks:
  - type: robot_pass
    name: examples_pass
    target: tests
    expected_tests: 4
    gating: true
  - type: custom_python
    name: native_robot_only
    func_ref: rf_skill_eval.scoring.custom.bdd:native_only
    gating: true
  - type: file_not_contains
    name: no_gherkin_parser_configured
    path: robot.toml
    regex: '(?i)GherkinParser|parsers|--parser'
    gating: true
  - type: custom_python
    name: test_bodies_are_steps
    func_ref: rf_skill_eval.scoring.custom.bdd:structure
    path: tests
    gating: true
  - type: custom_python
    name: suites_document_the_feature
    func_ref: rf_skill_eval.scoring.custom.bdd:living_docs
    path: tests
    gating: true
  - type: custom_python
    name: no_step_reads_1_days
    func_ref: rf_skill_eval.scoring.custom.bdd:step_names_absent
    path: tests
    regex: '(?<![\d.])1 days\b'
    gating: false
  - type: tool_call_count
    name: loaded_rf_bdd_skill
    tool_pattern: "(Skill|Read)"
    input_pattern: '(rf-bdd|/skills/rf-bdd/SKILL\.md)'
    min: 1
fixture: sut-bdd-library/base
primary_metric: robot_pass
