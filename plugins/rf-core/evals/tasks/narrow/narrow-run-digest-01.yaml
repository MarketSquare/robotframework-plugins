id: narrow-run-digest-01
skill: rf-run-digest
tier: narrow
description: |
  Run a suite and report from `robotcode results summary --failed`. Gated by
  a results.txt that holds the command's output.
prompt: |
  Run tests/example.robot into results/, save the output of the robotcode
  results summary --failed command to results/results.txt, then report the
  pass and fail counts from it.
model: claude-haiku-5-5
max_turns: 14
timeout_seconds: 300
allowed_tools:
  - Read
  - Write
  - Edit
  - Bash
  - Glob
  - Grep
  - Skill
grader_checks:
  - type: file_contains
    name: results_saved
    path: results/results.txt
    regex: '_Total:_ \d+'
fixture: sut-minimal
primary_metric: file_contains
