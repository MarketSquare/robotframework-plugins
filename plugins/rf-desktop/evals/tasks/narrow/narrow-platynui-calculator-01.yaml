id: narrow-platynui-calculator-01
skill: rf-platynui
tier: narrow
description: |
  Write a PlatynUI desktop test for a calculator flow (1 + 2 = 3). No desktop
  session exists on the runner, so the gating checks are static:
  keywords_resolve against the committed PlatynUI.BareMetal libdoc spec, and
  platynui_locators for the @Id locators that work on a real desktop.
prompt: |
  We automate desktop apps with Robot Framework and PlatynUI. README.md lists
  the Calculator element XPaths.

  Write tests/calculator.robot that brings the Calculator window to the front,
  clicks 1, +, 2, =, and verifies that the result display shows 3. There is no
  desktop session on this machine, so you cannot run it — make sure every
  keyword really exists in the PlatynUI.BareMetal library (a libdoc spec is in
  specs/).
model: claude-haiku-5-5
max_turns: 14
timeout_seconds: 300
allowed_tools:
  - Read
  - Write
  - Edit
  - Bash
  - Glob
  - Grep
  - Skill
expected_files:
  - path: tests/calculator.robot
    must_contain:
      - "PlatynUI.BareMetal"
grader_checks:
  - type: keywords_resolve
    name: platynui_keywords_resolve
    target: tests/calculator.robot
    specs: [specs/PlatynUI.BareMetal.json]
    required_libraries: [PlatynUI.BareMetal]
    min_calls: 4
  - type: custom_python
    name: platynui_locators
    func_ref: rf_skill_eval.scoring.custom.platynui:locators_ok
    target: tests/calculator.robot
    name_to_id: {One: num1Button, Two: num2Button, Plus: plusButton, Equals: equalButton}
    gating: true
  - type: file_contains
    name: targets_calculator
    path: tests/calculator.robot
    regex: "Calculator"
  - type: file_contains
    name: checks_result
    path: tests/calculator.robot
    regex: '(CalculatorResults|Get Attribute)'
  - type: tool_call_count
    name: loaded_rf_platynui_skill
    tool_pattern: "(Skill|Read)"
    input_pattern: '(rf-platynui|/skills/rf-platynui/SKILL\.md)'
    min: 1
fixture: sut-platynui
primary_metric: keywords_resolve
