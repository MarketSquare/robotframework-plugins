id: partial-platynui-calculator-01
skill: rf-platynui
tier: partial
description: |
  Same request as narrow-platynui-calculator-01, with only rf-core staged (a partial install).
  Passes when the answer suggests installing rf-desktop, or when the produced suite still passes the gating check; fails on library code from memory that fails it.
prompt: |
  We automate desktop apps with Robot Framework and PlatynUI. README.md lists
  the Calculator element XPaths.

  Write tests/calculator.robot that brings the Calculator window to the front,
  clicks 1, +, 2, =, and verifies that the result display shows 3. There is no
  desktop session on this machine, so you cannot run it — make sure every
  keyword really exists in the PlatynUI.BareMetal library (a libdoc spec is in
  specs/).
model: claude-haiku-5-5
stage: [rf-core]
max_turns: 14
timeout_seconds: 300
allowed_tools: [Read, Write, Edit, Bash, Glob, Grep, Skill]
grader_checks:
- type: custom_python
  name: suggests_plugin_or_passes
  func_ref: rf_skill_eval.scoring.custom.partial_install:suggests_plugin_or_passes
  plugin: rf-desktop
  check:
    type: keywords_resolve
    target: tests/calculator.robot
    specs: [specs/PlatynUI.BareMetal.json]
    required_libraries: [PlatynUI.BareMetal]
    min_calls: 4
  gating: true
fixture: sut-platynui
