id: narrow-mind-lookup-01
skill: rf-mind
tier: narrow
description: |
  Exact lookups in the sut-minimal repo: the definition of one keyword and
  every test with the checkout tag, each as file:line in FINDINGS.md. The
  checks pin the real line numbers, so a guessed or partial answer fails.
prompt: |
  Our Robot Framework repo has grown and I need exact locations before I
  change anything. Write FINDINGS.md at the repo root that lists:

  1. where the keyword "Log In As Default User" is defined, as file:line;
  2. every test tagged "checkout", one per line, as test name and file:line.

  Give paths relative to the repo root. Do not change any .robot or
  .resource file.
model: claude-haiku-5-5
max_turns: 12
timeout_seconds: 300
allowed_tools:
  - Read
  - Write
  - Edit
  - Bash
  - Glob
  - Grep
  - Skill
expected_files:
  - path: FINDINGS.md
    must_contain:
      - "Log In As Default User"
grader_checks:
  - type: file_contains
    name: keyword_definition_line
    path: FINDINGS.md
    regex: 'resources/common\.resource:16\b'
  - type: file_contains
    name: cart_test_line
    path: FINDINGS.md
    regex: 'tests/checkout_cart\.robot:13\b'
  - type: file_contains
    name: confirm_test_line
    path: FINDINGS.md
    regex: 'tests/checkout_confirm\.robot:13\b'
  - type: file_contains
    name: payment_test_line
    path: FINDINGS.md
    regex: 'tests/checkout_payment\.robot:13\b'
  - type: file_not_contains
    name: no_smoke_test_listed
    path: FINDINGS.md
    regex: 'tests/example\.robot'
  - type: tool_call_count
    name: loaded_rf_mind_skill
    tool_pattern: "(Skill|Read)"
    input_pattern: '(rf-mind|/skills/rf-mind/SKILL\.md)'
    min: 1
fixture: sut-minimal
primary_metric: file_contains
