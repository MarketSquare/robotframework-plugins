id: partial-browser-login-01
skill: rf-browser
tier: partial
description: |
  Same request as narrow-browser-login-01, with only rf-core staged (a partial install).
  Passes when the answer suggests installing rf-web, or when the produced suite still passes the gating check; fails on library code from memory that fails it.
prompt: |
  pages/login.html in this project is a small login page: inputs id="username"
  and id="password", a submit button id="submit". Logging in as demo/demo shows
  a div id="welcome" with the text "Welcome, demo".

  Write a Robot Framework test at tests/login.robot that uses the Browser
  library (Playwright) to open the page via a file:// URL, log in as demo/demo
  and verify the welcome text. Run it and make sure it passes. Playwright
  browsers are already installed.
model: claude-haiku-5-5
stage: [rf-core]
max_turns: 16
timeout_seconds: 420
allowed_tools: [Read, Write, Edit, Bash, Glob, Grep, Skill]
grader_checks:
- type: custom_python
  name: suggests_plugin_or_passes
  func_ref: rf_skill_eval.scoring.custom.partial_install:suggests_plugin_or_passes
  plugin: rf-web
  check:
    type: robot_pass
    target: tests/login.robot
    requires: [Browser]
    expected_tests: 1
  gating: true
fixture: sut-browser
